name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      # Dependabot #31 left package.json and the lockfile on different Fastify
      # majors. npm ci refuses that mismatch; npm install reconciles to the
      # Fastify 4 pin so in-repo 4.x plugins can register.
      - run: npm install --no-audit --no-fund
      - run: npm run -s build
      - run: npm test
