name: Docker

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  docker:
    uses: donny-devops/.github/.github/workflows/docker-build-push.yml@main
    with:
      image-name: 'donny-devops/node-ts-api-gateway'
      dockerfile: 'Dockerfile'
      push: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}
      enable-trivy: true
